name: Android CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build CATL投屏 Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/catl-release.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install pinned NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null || true
          sdkmanager --list_installed 2>/dev/null | grep -i ndk || true

      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"

      - name: Build release APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleNonRootRelease assembleRootRelease --console=plain --stacktrace

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          NAME="${GITHUB_REF_NAME//\//_}"
          for flavor in nonRoot root; do
            src=$(ls app/build/outputs/apk/${flavor}/release/app-${flavor}-release*.apk 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              label=$([ "$flavor" = "root" ] && echo "Root" || echo "非Root")
              cp "$src" "dist/CATL投屏-${NAME}-${label}.apk"
            fi
          done
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CATL投屏-APKs-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
