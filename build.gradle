// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        // AGP 只在 Google Maven；Central 对共享出口 IP 常 429，放后面兜底
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
    }
}

allprojects {
    repositories {
        // AndroidX 只在 Google Maven；Central 对共享出口 IP 常 429，放后面兜底
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
